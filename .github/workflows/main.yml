name: Pipeline

on:
  push:
    branche: feature/pipeline
  pull_request:
    branch: feature/pipeline

jobs:
  hello-world:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup a venv
        uses: actions/setup-python@v7
        with: 
          python-version: '3.13'

      - name: Installing python dependencies
        run:  pip install dotenv

      - name: Run
        run: python hello.py
    
  
