name: Pipeline

on:
  push:
    branches: [Dev,Val,Prod]
  pull_request:
    branches: [Dev,Val,Prod]

jobs:
    Branche-name:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Run
          run: git branch

    Division-test:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout Code
          uses: actions/checkout@v4
        
        - name: Setup Python
          uses: actions/setup-python@v4
          with:
            python-version: '3.15'
        - name: installing python dependencies
          run: pip install dotenv

        - name: Run
          run: python division.py

    Branch-Switch:
      needs: Division-test
      runs-on: ubuntu-latest
      with:
        fetch-depth: 0        

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: switch
          run: |
            git checkout Prod
            git push

